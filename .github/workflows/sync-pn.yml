# Preference numbers from clashwithjpa.com.
#
# This runs here rather than in the app because Cloudflare answers the call with a
# challenge page when it comes from Vercel. Whether it lets a GitHub runner through is the
# open question — if this job fails with "403 from Cloudflare", the answer is no, and
# `npm run sync-pn` from a laptop stays the way to do it.
name: Sync PN

on:
  workflow_dispatch:
  schedule:
    # The 5th of the month: CWL is underway and the rosters have settled. 04:45 UTC, just
    # after the app's own sync, so the boards are already fresh when this runs.
    - cron: "45 4 5 * *"

concurrency:
  group: sync-pn
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check the secrets are set
        # Without this a missing secret just fails somewhere deeper, and the annotation on
        # the run says nothing but "exit code 1".
        run: |
          test -n "$JPA_API_KEY" || { echo "::error::JPA_API_KEY repository secret is not set"; exit 1; }
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL repository secret is not set"; exit 1; }
        env:
          JPA_API_KEY: ${{ secrets.JPA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm ci
      - run: npm run sync-pn
        env:
          JPA_API_KEY: ${{ secrets.JPA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
